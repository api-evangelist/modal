specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Modal
providerId: modal
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- AI
- Serverless
- Compute
- Python
- Inference
- GPU
- Plans
description: >-
  Modal uses a serverless pay-per-second model for CPU, memory, GPU, and
  storage on top of three workspace tiers (Starter / Team / Enterprise) which
  set seat counts, container concurrency, GPU concurrency caps, and monthly
  free credits.
notes: >-
  Compute meters bill at second granularity. Storage includes 1 TiB free per
  month and bills $0.09 per GiB-month above that.
sources:
- https://modal.com/pricing
- https://modal.com/docs
plans:
- id: modal-starter
  name: Starter
  type: free
  description: >-
    Self-serve workspace tier with $30/month free credits, 3 workspace
    seats, 100 concurrent containers, and 10 concurrent GPUs.
  entries:
  - label: Monthly Subscription
    name: subscription
    type: flat
    metric: month
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  - label: Free Compute Credits
    name: free_credits
    type: usage
    metric: usd
    limit: 30
    timeFrame: month
    geo: global
    unit: 1
    price: $30 included free
    userMultiplied: false
  - label: Workspace Seats
    name: seats
    type: flat
    metric: seats
    limit: 3
    timeFrame: month
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Concurrent Containers
    name: concurrent_containers
    type: flat
    metric: concurrent
    limit: 100
    timeFrame: usage
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Concurrent GPUs
    name: concurrent_gpus
    type: flat
    metric: concurrent
    limit: 10
    timeFrame: usage
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: Functions
  - name: Sandboxes
  - name: Web Endpoints
  - name: Volumes
- id: modal-team
  name: Team
  type: subscription
  description: >-
    Team-tier workspace with $250/month subscription, $100/month free
    credits, unlimited seats, 1,000 concurrent containers, and 50
    concurrent GPUs.
  entries:
  - label: Monthly Subscription
    name: subscription
    type: flat
    metric: month
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    price: $250
    userMultiplied: false
  - label: Free Compute Credits
    name: free_credits
    type: usage
    metric: usd
    limit: 100
    timeFrame: month
    geo: global
    unit: 1
    price: $100 included free
    userMultiplied: false
  - label: Workspace Seats
    name: seats
    type: flat
    metric: seats
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: unlimited
    userMultiplied: false
  - label: Concurrent Containers
    name: concurrent_containers
    type: flat
    metric: concurrent
    limit: 1000
    timeFrame: usage
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Concurrent GPUs
    name: concurrent_gpus
    type: flat
    metric: concurrent
    limit: 50
    timeFrame: usage
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: Functions
  - name: Sandboxes
  - name: Web Endpoints
  - name: Volumes
  - name: Cron
- id: modal-enterprise
  name: Enterprise
  type: enterprise
  description: >-
    Custom enterprise pricing with volume discounts, unlimited seats,
    higher GPU concurrency, advanced security (HIPAA, SSO, audit logs),
    and dedicated support.
  entries:
  - label: Enterprise Agreement
    name: enterprise
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: HIPAA
  - name: SSO
  - name: Audit Logs
  - name: Custom Volume Discounts
- id: modal-compute
  name: Compute Pay-as-you-go (all tiers)
  type: usage
  description: >-
    Per-second metered compute applied across all workspace tiers
    (consumed first against included credits, then billed).
  entries:
  - label: CPU
    name: cpu
    type: usage
    metric: core_seconds
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0.0000131 per physical core-second (min 0.125 cores per container)
    userMultiplied: false
  - label: Memory
    name: memory
    type: usage
    metric: gib_seconds
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0.00000222 per GiB-second
    userMultiplied: false
  - label: NVIDIA T4
    name: gpu_t4
    type: usage
    metric: gpu_seconds
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0.000164 per GPU-second
    userMultiplied: false
  - label: NVIDIA L4
